# Apache site for the mock DEZI provider container, after devenv/jip/appconf.conf.
# A virtual host with its own CustomLog does not inherit the base image's query-bearing access log.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ServerName mock-dezi
    # The UserInfo endpoint reads the Bearer token from the Authorization header; pass it to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory "/var/www/html/public">
        Require all granted
        Options -MultiViews
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    # Apache's default error format appends Referer to PHP messages; omit request headers here too.
    ErrorLogFormat "[%t] [%m:%l] [pid %P] [client %a] %M"

    # Log only the method, path and protocol; no query strings or request/response headers.
    LogFormat '%h %l %u %t "%m %U %H" %>s %b' mock_dezi_safe
    CustomLog ${APACHE_LOG_DIR}/access.log mock_dezi_safe
</VirtualHost>
