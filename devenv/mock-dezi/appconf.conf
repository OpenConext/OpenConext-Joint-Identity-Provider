# Apache site for the mock DEZI provider container, after devenv/jip/appconf.conf.
DocumentRoot /var/www/html/public
ServerName mock-dezi
# The UserInfo endpoint reads the Bearer token from the Authorization header; pass it to PHP.
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

<Directory "/var/www/html/public">
    Require all granted
    Options -MultiViews
    RewriteEngine On
    RewriteBase /
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^(.*)$ index.php [QSA,L]
</Directory>
