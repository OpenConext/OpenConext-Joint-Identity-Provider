
# JIP POC backends (appended by devenv/bin/setup.sh)
backend jip_be
    server docker jip:80 check resolvers docker init-addr libc,none

backend mock-dezi_be
    server docker mock-dezi:80 check resolvers docker init-addr libc,none

backend jip-test-sp_be
    server docker jip-test-sp:80 check resolvers docker init-addr libc,none
