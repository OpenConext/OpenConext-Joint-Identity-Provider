# Apache site for the JointIdentityProvider (JIP) container, after devconf's core/engine/appconf.conf.
# A virtual host with its own CustomLog does not inherit the base image's query-bearing access log.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ServerName jip
    # EngineBlock authenticates with the Authorization header (design §12); pass it to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory "/var/www/html/public">
        Require all granted
        Options -MultiViews
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    Header always set X-Content-Type-Options "nosniff"

    SetEnv HTTPS on

    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(POST|GET)$
    RewriteRule .* - [R=405,L]

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Apache's default error format appends Referer to PHP messages; omit request headers here too.
    ErrorLogFormat "[%t] [%m:%l] [pid %P] [client %a] %M"

    # Log only the method, path and protocol; no query strings or request/response headers.
    LogFormat '%h %l %u %t "%m %U %H" %>s %b' jip_safe
    CustomLog ${APACHE_LOG_DIR}/access.log jip_safe
</VirtualHost>
