# JointIdentityProvider (JIP) POC: EngineBlock SBS settings for OpenConext-devconf (APP_ENV=dev).
# Installed by devenv/bin/setup.sh into <EngineBlock 7.2.1>/config/packages/dev/.
# Symfony loads config/packages/dev/* after config/packages/*, so these values win.
# Design §17 (EngineBlock block); hostnames are the devconf equivalents.
parameters:
    feature_enable_sram_interrupt: true
    sram.api_token: '%env(JIP_SBS_API_TOKEN)%'
    sram.base_url: 'https://jip.dev.openconext.local/'
    sram.authz_location: authz
    sram.attributes_location: attributes
    sram.interrupt_location: interrupt
    sram.verify_peer: true
    # DEZI attribute names: placeholders until govroam agrees them (§6, §10); not module names.
    sram.allowed_attributes:
        - 'urn:mace:govroam.nl:attribute-def:dezi:dezi-nummer'
        - 'urn:mace:govroam.nl:attribute-def:dezi:abonnee-nummer'
        - 'urn:mace:govroam.nl:attribute-def:dezi:rol-code'
        - 'urn:mace:govroam.nl:attribute-def:dezi:login'
    # Stated explicitly; the connector's engineblock.call_timeout_seconds must equal it (§13, §17 check 20).
    http_client.timeout: 10
