# Mock DEZI provider configuration (design §11, §14–§16, §18).
#
# MOCK ONLY. Every value here is a choice for the local mock at mock-dezi.dev.openconext.local.
# "PROVISIONAL" marks a value shaped after DEZI's specification v0.7 (a concept), DEZI's acceptance discovery or
# the design, which the CIBG has not confirmed (design §10, §16). No value in this file is a confirmed DEZI value,
# and none moves into JIP's acceptance or production configuration.
#
# The JIP side of this contract is jip/config/jip/mock.yaml; values that both sides use must stay equal.
issuer: 'https://mock-dezi.dev.openconext.local'

# PROVISIONAL: as DEZI acceptance discovery on 12 October 2026. The v0.7 example lists `none` only (design §16).
token_endpoint_auth_methods_supported: [none, private_key_jwt]

messages:
  envelope_issuer: 'auth.mock-dezi.dev.openconext.local'       # PROVISIONAL: shaped like v0.7's `auth.dezi.nl`
  statement_issuer: 'abonnee.mock-dezi.dev.openconext.local'   # PROVISIONAL: shaped like v0.7's `abonnee.dezi.nl`
  # PROVISIONAL: the envelope claim that carries the sealed statement. The design names the envelope's own claims
  # but not this one; the CIBG's example messages decide it (design §10).
  statement_claim: 'verklaring'
  loa_authn: 'http://eidas.europa.eu/LoA/high'                  # PROVISIONAL: the v0.7 example value (design §16)
  loa_dezi: 'http://eidas.europe.eu/LoA/high'                   # PROVISIONAL: the v0.7 example value, spelled as in v0.7
  json_schema: 'https://mock-dezi.dev.openconext.local/schema/verklaring-mock.json'   # mock placeholder

# PROVISIONAL: the status answer. The field names follow the v0.7 example (`verklaringId`, `revocatieTijdstip`);
# the table uses `verklaring_id` and `revocatie_tijdstip` (design §16). Only `actief` is named in the design;
# the other status values are mock inventions until the CIBG lists them (design §10).
status_response:
  id_field: 'verklaringId'
  status_field: 'status'
  revoked_at_field: 'revocatieTijdstip'
  active: 'actief'
  revoked: 'ingetrokken'
  other: 'mock-andere-status'

lifetimes:
  authorization_request_seconds: 600   # the login page must be completed within this time
  session_seconds: 3600                # the mock's own DEZI session, reused only without prompt=login (design §14)
  code_seconds: 60
  access_token_seconds: 300
  id_token_seconds: 300
  envelope_seconds: 300                # PROVISIONAL: DEZI's envelope lifetime is not known
  statement_seconds: 86400             # PROVISIONAL: DEZI's statement lifetime is not known

clock_skew_seconds: 60
# The longest client assertion the mock accepts (exp - iat). PROVISIONAL: DEZI's limit is open (design §10).
max_client_assertion_lifetime_seconds: 300
# How far before the attempt the auth_time of the `stale_auth_time` scenario lies.
stale_auth_time_seconds: 900
# How long an endpoint in `timeout` mode waits before it answers.
timeout_delay_seconds: 12
# Derives the pairwise `sub` per client sector. A fixed mock value, not a secret.
pairwise_salt: 'mock-dezi-pairwise-salt'

# Client registrations. Certificate files are read from MOCK_DEZI_CLIENT_KEYS_DIR (JIP's keys/mock locally).
# PROVISIONAL: form DEZI01.1 registers one encryption certificate and no signing key; how DEZI registers a signing
# key for private_key_jwt is open (design §10). The mock registers the signing certificate next to it.
clients:
  jip-mock-ggd:
    redirect_uris: ['https://jip.dev.openconext.local/oidc/callback']
    authentication: private_key_jwt
    signing_certificates: [ggd-signing.crt]   # two entries model a signing-key replacement (design §14)
    encryption_certificate: ggd-decryption.crt
    encryption_kid: ~                         # PROVISIONAL: ~ = the RFC 7638 thumbprint of the certificate's key
    envelope_audience: 'jip-mock-ggd-envelope'         # PROVISIONAL: the envelope `aud` is not assumed to be the client ID
    sector_identifier: 'jip.dev.openconext.local'
  # For JIP's `authentication: none` path, used only once the CIBG confirms DEZI wants no client authentication.
  jip-mock-ggd-none:
    redirect_uris: ['https://jip.dev.openconext.local/oidc/callback']
    authentication: none
    signing_certificates: []
    encryption_certificate: ggd-decryption.crt
    encryption_kid: ~
    envelope_audience: 'jip-mock-ggd-none-envelope'
    sector_identifier: 'jip.dev.openconext.local'
