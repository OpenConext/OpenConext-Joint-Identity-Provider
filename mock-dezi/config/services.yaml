services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $projectDir: '%kernel.project_dir%'
            string $configurationFile: '%env(MOCK_DEZI_CONFIG_FILE)%'
            string $fixturesFile: '%env(MOCK_DEZI_FIXTURES_FILE)%'
            string $clientKeysDirectory: '%env(MOCK_DEZI_CLIENT_KEYS_DIR)%'
            string $keysDirectory: '%env(MOCK_DEZI_KEYS_DIR)%'
            string $stateFile: '%env(MOCK_DEZI_STATE_FILE)%'

    MockDezi\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Configuration/ClientRegistration.php'
            - '../src/Configuration/MockConfiguration.php'
            - '../src/Configuration/InvalidMockConfiguration.php'
            - '../src/Configuration/StatusResponseNames.php'
            - '../src/Configuration/YamlNode.php'
            - '../src/Configuration/Paths.php'
            - '../src/Fixture/Person.php'
            - '../src/Fixture/Profile.php'
            - '../src/Scenario/'
            - '../src/Store/Record/'
            - '../src/Store/State.php'
            - '../src/Key/MessageType.php'
            - '../src/Message/Jose.php'

when@test:
    services:
        logger:
            class: Psr\Log\NullLogger
