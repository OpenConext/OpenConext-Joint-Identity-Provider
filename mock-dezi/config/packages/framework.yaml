# The mock keeps its own state in MOCK_DEZI_STATE_FILE; it uses no framework session.
framework:
    # Only defined so that framework services compile; the mock signs nothing with it.
    secret: '%env(default::APP_SECRET)%'
    session: false
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
