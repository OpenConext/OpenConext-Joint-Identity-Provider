services:
    _defaults:
        autowire: true
        autoconfigure: true

    JointIdentityProvider\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Core/Transaction/'
            - '../src/Core/Storage/SqliteTransactionStore.php'

    JointIdentityProvider\Core\Transaction\TransactionStore:
        factory: ['@JointIdentityProvider\Core\Storage\TransactionStoreFactory', 'create']

when@test:
    services:
        logger:
            class: Psr\Log\NullLogger
